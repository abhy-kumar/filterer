name: Update Market Data & Fundamental Scans

on:
  schedule:
    # Runs at 10:15 UTC (3:45 PM IST) Monday through Friday (post market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Data & Fundamentals Pipeline
        run: |
          python scripts/generate_stocks_dataset.py

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.db.part_* src/data/stocksData.ts
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): automated daily market close dataset refresh [skip ci]"
            git push origin main || git push origin master
          fi
