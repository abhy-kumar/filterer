name: Update Market Data & Fundamental Scans

on:
  schedule:
    # Runs every Saturday at 06:00 UTC (11:30 AM IST) — weekly to avoid rate limits
    - cron: '0 6 * * 6'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      # Firebase credentials stored as GitHub secret (base64 encoded JSON)
      FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Firebase Credentials
        if: env.FIREBASE_CREDENTIALS != ''
        run: |
          echo "$FIREBASE_CREDENTIALS" | base64 -d > data_pipeline/firebase-credentials.json

      - name: Run Real Data Pipeline
        run: |
          python scripts/generate_stocks_dataset.py --limit 200 --rate-limit 1.0 ${{ env.FIREBASE_CREDENTIALS != '' && '--firebase' || '' }}

      - name: Run Unit Tests
        run: |
          pytest tests/ || echo "Tests failed but continuing with data commit"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.db.part_* src/data/stocksData.ts data/market_indices.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): weekly market data refresh from Yahoo Finance [skip ci]"
            git push origin main || git push origin master
          fi

      - name: Cleanup Firebase Credentials
        if: always()
        run: |
          rm -f data_pipeline/firebase-credentials.json
